[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olaverse-foundry"
version = "0.2.1"
description = "Small, specialised models from big general ones — synthesize data for no-data languages, distil, train retrieval, and benchmark head-to-head."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"

authors = [
  { name = "Olaverse Labs", email = "hello@olaverse.co.uk" }
]

keywords = [
  "llm", "distillation", "retrieval", "embeddings", "synthetic-data",
  "low-resource-languages", "african-nlp", "model-merging", "lora",
  "skill-packs", "olaverse", "foundry"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core install — numpy + pydantic + yaml only, no GPU required
dependencies = [
  "numpy>=1.24.0",
  "pydantic>=2.0.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Real model loading + local inference
torch = [
  "torch>=2.0.0",
  "transformers>=4.40.0",
  "huggingface_hub>=0.20.0",
  "safetensors>=0.4.0",
  "accelerate>=0.27.0",
]

# LoRA skill packs
lego = [
  "peft>=0.10.0",
]

# Datasets for training
data = [
  "datasets>=2.18.0",
]

# Fast cross-tokenizer alignment (C-extension Levenshtein, ~100× speedup)
align = [
  "rapidfuzz>=3.0.0",
]

# Experiment tracking
logging = [
  "wandb>=0.16.0",
]

# Everything
all = [
  "olaverse-foundry[torch,lego,data,align,logging]",
]

# Dev / test
dev = [
  "pytest>=7.0",
  "pytest-cov",
]

# Lint + type gate (CI "quality" job)
lint = [
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

# Documentation site (mkdocs build / serve / gh-deploy)
docs = [
  "mkdocs-material>=9.5",
]

[project.scripts]
foundry = "foundry.cli:main"

[project.urls]
# Documentation is listed first and by name so PyPI renders it in the sidebar —
# the docs site is otherwise reachable only from inside the README.
Documentation = "https://olaverse-labs.github.io/olaverse-foundry/"
Homepage      = "https://olaverse.co.uk"
Repository    = "https://github.com/Olaverse-Labs/olaverse-foundry"
Changelog     = "https://olaverse-labs.github.io/olaverse-foundry/changelog/"
Issues        = "https://github.com/Olaverse-Labs/olaverse-foundry/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["foundry*"]

# PEP 561 marker — without it type checkers ignore foundry's annotations
# entirely, even though every public function is typed.
[tool.setuptools.package-data]
foundry = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ── Lint ──────────────────────────────────────────────────────────────────────
# Deliberately scoped to correctness, not style: pyflakes (F), syntax errors
# (E9), bugbear (B), comprehension and dead-code rules. Formatting rules
# (line length, import order, quote style) are left out so the gate stays
# signal — a red lint run means a real defect, not a reflow.
#
# pyupgrade (UP) is *not* enabled on purpose. It rewrites `Optional[X]` to
# `X | None`, which is a runtime error on Python 3.9 in any annotation that is
# evaluated eagerly — exactly the bug that broke every `foundry.fusion` import
# in 0.2.0 (see changelog 0.2.1). The floor stays 3.9 until the floor moves.
[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["F", "E9", "B", "C4", "PIE", "SIM105"]
ignore = [
  "B007",   # unused loop control var — `for epoch in range(...)` reads better than `_epoch`
  "B008",   # function call in default arg — not a pattern this codebase uses wrongly
  "B905",   # zip(strict=) — not available on 3.9
]

[tool.ruff.lint.per-file-ignores]
# Re-exports are the point of a package __init__.
"foundry/__init__.py" = ["F401"]
"foundry/*/__init__.py" = ["F401"]

# ── Types ─────────────────────────────────────────────────────────────────────
# foundry ships py.typed, so these annotations are part of the public contract
# and consumers type-check against them. This gate keeps that promise honest.
#
# python_version is 3.10, not the 3.9 floor, because mypy >= 1.15 dropped
# support for targeting 3.9. Runtime 3.9 compatibility is covered instead by
# the import check in CI, which runs on the floor version.
[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.10"
files = ["foundry"]
ignore_missing_imports = true       # torch/transformers/peft are optional extras
follow_imports = "silent"
warn_unused_ignores = false
disable_error_code = ["annotation-unchecked"]
