name: Publish to PyPI

on:
  release:
    types: [published]
  # Pushing a vX.Y.Z tag publishes that version, so a release can be cut from the
  # command line without going through the GitHub Releases UI.
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # A PyPI version can never be replaced, only yanked. Publishing on a tag
  # without running the suite means one bad tag is permanent, so the release
  # runs the full CI gate first — tests on 3.9-3.12, the core-install check,
  # the import floor, ruff and mypy.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tag is the source of truth for what gets published; if it disagrees
      # with pyproject.toml the wrong version ships silently under the right tag.
      - name: Check tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $pkg" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Releases before this workflow existed were uploaded by hand, so
          # back-filled tags re-run against versions already on PyPI.
          skip-existing: true
